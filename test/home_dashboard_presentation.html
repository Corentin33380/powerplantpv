<pre id="result">Waiting</pre>
<script>
document.addEventListener('DOMContentLoaded', function () {
 var checks = 0;
 function check(value, message) { if (!value) throw new Error(message); checks++; }
 try {
  var plant = document.querySelector('.bg-infobox-powerplantpv').closest('.info-box');
  var maintenance = document.querySelector('.bg-infobox-powerplantpvmaintenance').closest('.info-box');
  check(plant.querySelectorAll('.info-box-line').length === 2, 'Only two plant rows after two initializations');
  var inLink = plant.querySelector('a[href$="search_status=2"]');
  var outLink = plant.querySelector('a[href$="search_status=3"]');
  check(inLink.closest('.info-box-line') === outLink.closest('.info-box-line'), 'Service states share a row');
  check(inLink.href !== outLink.href, 'Each service label keeps its filtered destination');
  check(inLink.title === 'En service' && outLink.title === 'Hors service', 'Both labels retain text tooltips');
  ['1','2','3'].forEach(function (status, i) {
   var badge = plant.querySelector('a[href$="search_status='+status+'"] .classfortooltip');
   check(badge.classList.contains(['badge-secondary','badge-success','badge-danger'][i]), 'Plant badge color '+status);
  });
  ['planned,due,scheduled,overdue,covered,incomplete','planned,due','overdue'].forEach(function (status,i) {
   var badge = maintenance.querySelector('a[href$="search_status='+status+'"] .classfortooltip');
   check(badge.classList.contains(['badge-secondary','badge-warning','badge-danger'][i]), 'Maintenance badge color '+status);
  });
  check(plant.querySelectorAll('a').length === 6 && maintenance.querySelectorAll('a').length === 6, 'All labels and count links retained');
  check(document.querySelector('#other-tile span').className === 'classfortooltip badge badge-info', 'Other modules untouched');
  check(plant.querySelector('a[href$="search_status=1"] .classfortooltip').textContent === '0', 'Zero count retained and badged');
  var red = getComputedStyle(plant.querySelector('.badge-danger')).backgroundColor.match(/\d+/g).map(Number);
  var orange = getComputedStyle(maintenance.querySelector('.badge-warning')).backgroundColor.match(/\d+/g).map(Number);
  check(red[0] > red[1] * 2 && red[1] === red[2], 'Danger hue is red, not the theme brown');
  check(orange[0] > orange[1] && orange[1] > orange[2], 'To-schedule hue is orange');
  document.getElementById('result').textContent = checks+' checks passed';
 } catch (error) { document.getElementById('result').textContent = 'FAILED: '+error.message; throw error; }
});
</script></body></html>
